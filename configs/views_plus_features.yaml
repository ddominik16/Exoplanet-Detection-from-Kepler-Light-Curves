name: two_branch_features
model: two_branch        # two_branch | global_only | mlp
seed: 42

augment: true
clip: null

# TCE-table numbers given to the dense layers next to the two views.
# The views are normalised to depth -1, so these give back the information that removes.
features: [tce_depth, tce_model_snr, tce_impact, tce_period, tce_duration]

dropout: 0.3
dense_width: 512
dense_layers: 4

batch_size: 64
lr: 1.0e-4
weight_decay: 0.0
max_epochs: 100
patience: 15
pos_weight: auto
